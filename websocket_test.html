<!DOCTYPE html>
<html>
<head>
    <title>ESP32 WebSocket Test</title>
</head>
<body>
    <h1>ESP32 WebSocket Connection Test</h1>
    <div>
        <label for="wsUrl">WebSocket URL:</label>
        <input id="wsUrl" type="text" style="width: 360px;" />
        <button id="connectBtn">Connect</button>
    </div>
    <div id="status">Ready</div>
    <div id="messages"></div>
    
    <script>
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        const wsUrlInput = document.getElementById('wsUrl');
        const connectBtn = document.getElementById('connectBtn');
        let socket = null;

        const params = new URLSearchParams(window.location.search);
        const wsFromQuery = params.get('ws');
        const wsFromStorage = localStorage.getItem('esp32_ws_url');
        const defaultWsUrl = 'ws://192.168.11.109:81';
        wsUrlInput.value = wsFromQuery || wsFromStorage || defaultWsUrl;
        
        function log(message) {
            console.log(message);
            messagesDiv.innerHTML += '<p>' + new Date().toLocaleTimeString() + ': ' + message + '</p>';
        }
        
        function connect() {
            const wsUrl = wsUrlInput.value.trim();
            if (!wsUrl) {
                log('WebSocket URL is empty');
                return;
            }
            
            localStorage.setItem('esp32_ws_url', wsUrl);
            statusDiv.textContent = 'Testing connection...';
            statusDiv.style.color = 'black';

            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
                socket.close();
            }

            log('Attempting to connect to ' + wsUrl);
            socket = new WebSocket(wsUrl);
            socket.onopen = function(event) {
                statusDiv.textContent = 'Connected!';
                statusDiv.style.color = 'green';
                log('WebSocket connection opened');
            };
            
            socket.onmessage = function(event) {
                log('Received: ' + event.data);
            };
            
            socket.onerror = function(event) {
                statusDiv.textContent = 'Error!';
                statusDiv.style.color = 'red';
                log('WebSocket error: ' + JSON.stringify(event));
            };
            
            socket.onclose = function(event) {
                statusDiv.textContent = 'Disconnected';
                statusDiv.style.color = 'orange';
                log('WebSocket closed. Code: ' + event.code + ', Reason: ' + event.reason);
            };

            return socket;
        }
            
        connectBtn.addEventListener('click', connect);
        connect();
    </script>
</body>
</html>
