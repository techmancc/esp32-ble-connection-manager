; Common configuration for all ESP32-S3 environments
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Library dependencies for your BLE project
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    bblanchon/ArduinoJson@^6.21.3
    links2004/WebSockets@^2.4.0

; Common build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUHAL_ESP_LOG
    -std=gnu++17
    ; Enable BLE Security Features
    -DCONFIG_BT_NIMBLE_SM_BONDING=1
    -DCONFIG_BT_NIMBLE_SM_SC=1
    -DCONFIG_BT_NIMBLE_DEBUG=1

; ESP32-S3 N16R8 Configuration (16MB Flash, 8MB PSRAM)
[env:esp32s3-n16r8]
board = esp32-s3-devkitc-1

; Flash and PSRAM configuration for N16R8
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.memory_type = qio_opi
board_build.partitions = huge_app.csv

; Build flags specific to PSRAM model
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    -DESP32S3

; Flash configuration
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L