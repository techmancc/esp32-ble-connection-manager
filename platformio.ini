; Common configuration for all ESP32-S3 environments
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Library dependencies for your BLE project
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    bblanchon/ArduinoJson@^6.21.3
    links2004/WebSockets@^2.4.0

; Common build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUHAL_ESP_LOG
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Enable BLE Security Features
    -DCONFIG_BT_NIMBLE_SM_BONDING=1
    -DCONFIG_BT_NIMBLE_SM_SC=1
    -DCONFIG_BT_NIMBLE_DEBUG=1

; ESP32-S3 configuration for no-PSRAM board variant
[env:esp32s3-n16r8]
board = esp32-s3-devkitc-1

; Flash/memory configuration
board_build.flash_size = 8MB
board_build.memory_type = qio_qspi
board_build.partitions = huge_app.csv

; Build flags
build_flags =
    ${env.build_flags}
    -DARDUINO_ESP32S3_DEV
    -DESP32S3

; Flash configuration
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; Debug build configuration for troubleshooting
[env:esp32s3-n16r8-debug]
extends = env:esp32s3-n16r8
build_type = debug
build_flags =
    ${env:esp32s3-n16r8.build_flags}
    -g
    -DCORE_DEBUG_LEVEL=4
monitor_filters = esp32_exception_decoder, log2file